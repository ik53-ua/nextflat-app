spring:
  application:
    name: nextflat

  # Apagar la seguridad
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  # Configuración de la Base de Datos (Supabase / PostgreSQL)
  datasource:
    url: jdbc:postgresql://aws-1-eu-central-1.pooler.supabase.com:5432/postgres
    username: postgres.rxpgzthbvgjbkatalyly
    password: LaContraseñaMasSeguraDelMundo1234567890.
    driver-class-name: org.postgresql.Driver
    # Configuración para evitar cortes de conexión con Supabase
    hikari:
      maximum-pool-size: 2
      max-lifetime: 120000
      idle-timeout: 60000
      keepalive-time: 30000

  # Configuración de Hibernate / JPA
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

server:
  port: 8080
